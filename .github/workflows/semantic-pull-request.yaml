name: Semantic Pull Request

# Squash merges use the PR title as the commit message, so the title is what
# lands on main and is what needs to follow Conventional Commits.
on:
  pull_request:
    branches: [main]
    # synchronize keeps the check current on every push, which a required
    # check needs.
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  main:
    name: Semantic Pull Request
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        with:
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            didn't match the configured pattern. Please ensure that the subject
            doesn't start with an uppercase character.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
